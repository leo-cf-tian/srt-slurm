# Config: ctx8_pp4_gen1_dep32_batch8_eplb0_mtp0
# max global bs: 256, concurrency: 512

name: "gb200-fp4-128k8k-ctx8_pp4_gen1_dep32_batch8_eplb0_mtp0"

model:
  path: "dsfp4"
  container: "vllm/vllm-openai:cu130-nightly-aarch64"
  precision: "fp4"

dynamo:
  top_of_tree: true
  install: true

setup_script: install-deps.sh

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  prefill_nodes: 8
  prefill_workers: 8
  decode_nodes: 8
  decode_workers: 1
  gpus_per_prefill: 4
  gpus_per_decode: 32

frontend:
  type: dynamo
  enable_multiple_frontends: false

backend:
  type: vllm
  connector: nixl

  decode_environment:
    PYTHONUNBUFFERED: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    VLLM_USE_NCCL_SYMM_MEM: "1"
    VLLM_USE_FLASHINFER_MOE_FP4: "1"
    VLLM_DEEPEPLL_NVFP4_DISPATCH: "1"
    VLLM_FLASHINFER_MOE_BACKEND: "cutedsl"

  prefill_environment:
    PYTHONUNBUFFERED: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    VLLM_USE_NCCL_SYMM_MEM: "1"
    VLLM_USE_FLASHINFER_MOE_FP4: "1"
    VLLM_FLASHINFER_MOE_BACKEND: "cutedsl"

  vllm_config:
    decode:
      served-model-name: "deepseek-ai/DeepSeek-R1"
      kv-cache-dtype: "fp8"
      attention-backend: "TRTLLM_MLA"
      tensor-parallel-size: 1
      data-parallel-size: 32
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      max-model-len: 136001
      max-num-seqs: 256
      gpu-memory-utilization: 0.80
      no-enable-prefix-caching: true
      no-enable-chunked-prefill: true
      all2all-backend: "deepep_low_latency"
      quantization: "modelopt_fp4"
      trust-remote-code: true
      stream-interval: 10
      async-scheduling: true
      max-cudagraph-capture-size: 16
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","custom_ops":["+quant_fp8","+rms_norm","+rotary_embedding"],"pass_config":{"fuse_attn_quant":true,"fuse_allreduce_rms":true}}'
      safetensors-load-strategy: "prefetch"
      block-size: 64

    prefill:
      served-model-name: "deepseek-ai/DeepSeek-R1"
      kv-cache-dtype: "fp8"
      attention-backend: "TRTLLM_MLA"
      tensor-parallel-size: 1
      pipeline-parallel-size: 4
      max-model-len: 136001
      max-num-seqs: 32
      gpu-memory-utilization: 0.72
      no-enable-prefix-caching: true
      no-enable-chunked-prefill: true
      quantization: "modelopt_fp4"
      trust-remote-code: true
      stream-interval: 10
      enforce-eager: true
      compilation-config: '{"custom_ops":["+quant_fp8","+rms_norm","+rotary_embedding"],"pass_config":{"fuse_attn_quant":true,"fuse_allreduce_rms":true}}'
      safetensors-load-strategy: "prefetch"
      block-size: 64

benchmark:
  type: "sa-bench"
  isl: 128000
  osl: 8000
  concurrencies: "512"
  req_rate: "inf"
