name: "minimax-m2.5-vllm-disagg-gb200-decode-dep2"

model:
  path: "/lustre/fsw/coreai_dlfw_dev/lctian/semi-analysis/models/MiniMax-M2.5-NVFP4"
  container: "/lustre/fsw/coreai_dlfw_dev/lctian/semi-analysis/nightly+dynamo+cuda13.sqsh"
  precision: "fp4"

dynamo:
  top_of_tree: true
  install: false

setup_script: install-deps.sh

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  prefill_nodes: 1
  decode_nodes: 1
  prefill_workers: 1
  decode_workers: 1
  gpus_per_prefill: 2
  gpus_per_decode: 2

frontend:
  type: dynamo
  enable_multiple_frontends: false

backend:
  type: vllm
  connector: null

  prefill_environment:
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_FLASHINFER_ALLREDUCE_BACKEND: "mnnvl"
    VLLM_USE_NCCL_SYMM_MEM: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"

  decode_environment:
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_FLASHINFER_ALLREDUCE_BACKEND: "mnnvl"
    VLLM_USE_NCCL_SYMM_MEM: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"

  vllm_config:
    prefill:
      kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 2
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      enforce-eager: true
      safetensors-load-strategy: "prefetch"
      max-model-len: 10240
      max-num-batched-tokens: 10240
      trust-remote-code: true
      no-enable-prefix-caching: true
      no-enable-chunked-prefill: true

    decode:
      kv-transfer-config: '{"kv_connector": "DecodeBenchConnector", "kv_role": "kv_both"}'
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 2
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      all2all-backend: "allgather_reducescatter"
      async-scheduling: true
      max-num-seqs: 64
      block-size: 64
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","custom_ops":["+quant_fp8","+rms_norm","+rotary_embedding"],"pass_config":{"fuse_attn_quant":true,"fuse_allreduce_rms":true}}'
      gpu-memory-utilization: 0.9
      stream-interval: 50
      safetensors-load-strategy: "prefetch"
      max-model-len: 10240
      max-num-batched-tokens: 10240
      trust-remote-code: true
      no-enable-prefix-caching: true
      no-enable-chunked-prefill: true

benchmark:
  type: "sa-bench"
  isl: 1024
  osl: 1024
  concurrencies: "2x4x8x16x32x64x128"
