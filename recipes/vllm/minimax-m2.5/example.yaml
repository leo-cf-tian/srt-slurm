name: "minimax-m2.5-vllm-disagg-gb200-dep2-dep4"

# model:
#   path: "/lustre/fsw/coreai_dlfw_dev/lctian/semi-analysis/models/MiniMax-M2.5-NVFP4"
#   container: "v0.18.1"
#   precision: "fp4"

# dynamo:
#   version: 1.0.1
#   install: false

model:
  path: "/lustre/fsw/coreai_dlfw_dev/lctian/semi-analysis/models/MiniMax-M2.5-NVFP4"
  container: "/lustre/fsw/coreai_dlfw_dev/lctian/semi-analysis/nightly+dynamo+cuda13.sqsh"
  precision: "fp4"

dynamo:
  top_of_tree: true
  install: false



setup_script: install-deps.sh

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  prefill_nodes: 1
  decode_nodes: 1
  prefill_workers: 1
  decode_workers: 1
  gpus_per_prefill: 2
  gpus_per_decode: 4

frontend:
  type: dynamo
  enable_multiple_frontends: false

backend:
  type: vllm
  connector: null

  prefill_environment:
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_FLASHINFER_ALLREDUCE_BACKEND: "mnnvl"

  decode_environment:
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_FLASHINFER_ALLREDUCE_BACKEND: "mnnvl"

  vllm_config:
    prefill:
      kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 2
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      safetensors-load-strategy: "prefetch"
      max-model-len: 10240
      max-num-batched-tokens: 10240
      trust-remote-code: true
      no-enable-prefix-caching: true

    decode:
      kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 4
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      safetensors-load-strategy: "prefetch"
      max-model-len: 10240
      max-num-batched-tokens: 10240
      trust-remote-code: true
      no-enable-prefix-caching: true

benchmark:
  type: "sa-bench"
  isl: 1024
  osl: 1024
  concurrencies: "1024x1536x2048"
